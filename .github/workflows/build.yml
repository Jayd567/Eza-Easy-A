name: Build + Upload Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # Nightly release, 03:17 UTC
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:

  # Skip the nightly build when main hasn't moved since the last one
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        last=$(gh api "repos/$GH_REPO/commits/nightly" --jq .sha 2>/dev/null || true)
        if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.2
    - name: Build Binary
      run: cargo build --release --features engine --verbose
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./vscode-eza/package-lock.json

    - name: Install Dependencies
      working-directory: ./vscode-eza
      run: npm ci
    - name: Package vscode extension
      run: |
        Copy-Item "./LICENSE.txt" -Destination ./vscode-eza -Force
        cd ./vscode-eza
        npx @vscode/vsce package --allow-missing-repository
    - name: Package into folder + zip
      shell: pwsh
      run: |
          New-Item -ItemType Directory -Force -Path "Eza"
          Copy-Item "target/release/eza.exe" -Destination "Eza/" -Force
          Copy-Item "artifact-files\*" -Destination "Eza/" -Recurse -Force
          Copy-Item "./vscode-eza/eza-lang-0.1.0.vsix" -Destination "Eza/" -Force
          Compress-Archive -Path "Eza" -DestinationPath "eza-windows.zip"
    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v7
      with:
        name: eza-windows
        path: eza-windows.zip
        archive: false
        if-no-files-found: error
    - name: Publish nightly release
      if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Same name as the stable release asset (Windows paths ignore case, so use a folder)
        New-Item -ItemType Directory -Force -Path "nightly" | Out-Null
        Copy-Item "eza-windows.zip" -Destination "nightly/Eza-Windows.zip" -Force
        $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
        $sha = "${{ github.sha }}".Substring(0, 7)
        gh release delete nightly --yes --cleanup-tag 2>$null
        $global:LASTEXITCODE = 0
        gh release create nightly "nightly/Eza-Windows.zip" `
          --prerelease `
          --target "${{ github.sha }}" `
          --title "Nightly ($date)" `
          --notes "Built automatically from main at $sha on $date. Nightly builds have the newest features but may be unstable; for a stable version use the latest release."
