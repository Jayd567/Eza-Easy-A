name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Binary
      run: cargo build --release --verbose
    - name: Package into folder + zip
      shell: pwsh
      run: |
          New-Item -ItemType Directory -Force -Path "Eza"
          Copy-Item "target/release/eza.exe" -Destination "Eza/"
          Compress-Archive -Path "Eza" -DestinationPath "eza-windows.zip"
    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-windows-binary
        path: target/release/eza.exe  
        if-no-files-found: error      
